<style>
/* Layout: sticky status header (cash, level, tabs) over a single column of waybill-style rows. Dashed rules and stamp chips borrow from cargo paperwork. */
:root{
  --bg:#EDEFEA; --surface:#FBFCFA; --surface-2:#E1E6E0; --ink:#10252C; --muted:#566A6E; --line:#C7D0C9;
  --accent:#E0501A; --accent-ink:#FFFFFF; --blob1:#FF9A62; --blob2:#7FC8B4; --blob3:#F2D16B; --good:#17734A; --bad:#B3261E; --warn:#8F5E00; --focus:#1F4FD8;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C181C; --surface:#13242A; --surface-2:#1B3139; --ink:#E4EDEB; --muted:#93A8AC; --line:#2A424A;
    --accent:#FF7A3D; --accent-ink:#1A0B03; --blob1:#B8470F; --blob2:#0E6B63; --blob3:#7A5C00; --good:#4CC38A; --bad:#FF8A80; --warn:#E8B34A; --focus:#7AA2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C181C; --surface:#13242A; --surface-2:#1B3139; --ink:#E4EDEB; --muted:#93A8AC; --line:#2A424A;
  --accent:#FF7A3D; --accent-ink:#1A0B03; --blob1:#B8470F; --blob2:#0E6B63; --blob3:#7A5C00; --good:#4CC38A; --bad:#FF8A80; --warn:#E8B34A; --focus:#7AA2FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:780px;margin:0 auto;position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-top:10px;border-bottom:1px solid var(--line)}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font:700 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.date{color:var(--muted);font-size:13px;margin-top:6px}
.cash{text-align:right}
.cash .lbl{display:block;color:var(--muted);font-size:12px}
.cash b{font:700 21px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.lvl{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.lvl span{white-space:nowrap}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s}}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);margin-top:6px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 2px 9px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

main{padding-top:18px;display:flex;flex-direction:column;gap:22px}
h2{font:500 12px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
p{margin:0}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;min-height:44px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.lab{font-size:13px;color:var(--muted);margin:14px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stamp{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border-style:dashed}
.stamp.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-style:solid}
.stamp small{font-size:11px;opacity:.8}
.stamp.lock{opacity:.5;cursor:not-allowed}
ol.steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.rows{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.item:first-child{padding-top:0}
.item.dim{opacity:.55}
.ico{color:var(--accent);padding-top:2px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.top b{font-weight:600}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.mg{position:fixed;inset:0;z-index:40;background:rgba(8,20,24,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mgb{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.mgb h2{margin-top:0}
.hg{position:relative;height:30px;border-radius:15px;background:var(--surface-2);overflow:hidden;margin:14px 0;border:1px solid var(--line)}
.hz{position:absolute;top:0;bottom:0;left:38%;width:24%;background:var(--good);opacity:.35}
.hm{position:absolute;top:0;bottom:0;width:6px;background:var(--accent);left:calc(50% - 3px)}
.pkg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pk{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;color:var(--ink)}
.pk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot{font-family:var(--display);font-size:18px;text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:10px;margin:12px 0;min-height:64px}
.mode{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--surface)}
.mode.cur{border-color:var(--accent)}
.mode h3{margin:0 0 4px;font-size:15px}
.mode p{margin:0 0 8px}
.chipm{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.step{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.step button{width:40px;min-height:40px;border:0;background:var(--surface-2);font-size:18px;line-height:1}
.step input{width:70px;border:0;background:transparent;color:var(--ink);text-align:center;font:600 16px var(--mono);-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.tag.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.stat span{display:block;color:var(--muted);font-size:12px}
.stat b{font:700 17px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ln:last-child{border-bottom:0}
.ln.total{font-weight:600;border-top:1px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.pips{display:flex;gap:4px;margin:6px 0}
.pips i{width:18px;height:6px;border-radius:2px;background:var(--surface-2)}
.pips i.on{background:var(--accent)}
.up{padding:14px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.up:first-child{padding-top:0}
.up .top b{font-size:16px}
.log{display:flex;flex-direction:column}
.log div{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;gap:12px}
.log time{font:500 12px var(--mono);color:var(--muted);min-width:44px;padding-top:2px}
.done{color:var(--good)}
.ttl{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:9px 10px;min-height:40px;font:16px var(--body)}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.34;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:var(--blob1)}
.bg i:nth-child(2){width:38vmax;height:38vmax;right:-12vmax;top:30vh;background:var(--blob2);animation-duration:30s;animation-delay:-9s}
.bg i:nth-child(3){width:34vmax;height:34vmax;left:22vw;bottom:-16vmax;background:var(--blob3);animation-duration:27s;animation-delay:-15s}
.bg b{position:absolute;top:0;opacity:.13;color:var(--ink);animation:rise linear infinite}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(7vmax,-5vmax) scale(1.16)}}
@keyframes rise{from{transform:translateY(108vh) rotate(0deg)}to{transform:translateY(-16vh) rotate(300deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mv{from{transform:translateX(-50px)}to{transform:translateX(360px)}}
@keyframes cl{from{transform:translateX(0)}to{transform:translateX(-340px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.scene{display:block;width:100%;height:100%}
.scene .mv{animation:mv linear infinite}
.scene .cl{animation:cl linear infinite}
.scene .bob{animation:bob 2.4s ease-in-out infinite}
.scene .wv{animation:wv 2.6s linear infinite}
.scene .sp{animation:spin .8s linear infinite;transform-box:fill-box;transform-origin:center}
.scene .bn{animation:bounce 1.8s ease-in-out infinite}
.scene .pl{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.car{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.car-track{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.car-slide{position:relative;flex:0 0 100%;min-width:0;aspect-ratio:2/1;overflow:hidden}
.car-slide .scene{position:absolute;inset:0}
.car-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff}
.car-cap b{display:block;font:700 15px/1.25 var(--display)}
.car-cap span{display:block;margin-top:3px;font-size:13px;opacity:.92}
.car-dots{position:absolute;right:6px;top:4px;display:flex}
.car-dots button{width:24px;height:24px;padding:8px;border:0;border-radius:50%;background:rgba(255,255,255,.55);background-clip:content-box}
.car-dots button.on{background:#fff;background-clip:content-box}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.32);color:#fff;font-size:22px;line-height:1}
.car-btn.l{left:8px}.car-btn.r{right:8px}
.mk-bar{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,var(--mk1),var(--mk2));border-radius:12px;padding:10px 12px}
.mk-logo{font:700 15px/1 var(--display);color:#fff;letter-spacing:.02em}
.mk-q{flex:1;min-width:0;border:0;border-radius:20px;padding:9px 14px;min-height:38px;font:16px var(--body);background:#fff;color:#1a1a1a}
.mk-tabs{margin:12px 0 4px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard.lock{opacity:.55}
.pimg{position:relative;display:grid;place-items:center;height:96px;color:var(--ink)}
.pico{display:inline-block;animation:float 4s ease-in-out infinite}
.pbadge{position:absolute;left:8px;top:8px;background:#C9211B;color:#fff;font:700 12px var(--mono);padding:3px 7px;border-radius:6px}
.pb{padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pn{font-weight:600;font-size:14px;line-height:1.25}
.big{font-size:17px;font-weight:700;color:var(--accent)}
.pb .btn{width:100%}
@media (prefers-reduced-motion:reduce){.bg i,.bg b,.pico,.scene *{animation:none!important}.car-track{transition:none}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .ca{fill:var(--accent);opacity:.14}
.chart .cl2{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .cd{fill:var(--accent)}
.chart .ct{fill:var(--muted);font:10px var(--mono)}
.chart .bp{fill:var(--good)}
.chart .bn2{fill:var(--bad)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.pbar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.pbar i.bad{background:var(--bad)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.rev{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rev:last-child{border-bottom:0}
.rev .st{color:var(--accent);letter-spacing:2px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.over{text-align:center;padding:28px 16px}
.over h1{font:700 20px/1.2 var(--display);margin:0 0 10px}
html,body{touch-action:manipulation}button,a,input,select,label,.chip,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}@media (pointer:coarse){input,select,textarea{font-size:16px}}
</style>

  return {i:i,name:T[i][1],from:T[i][0],next:nx?nx[0]:null,pct:nx?(s.sold-T[i][0])/(nx[0]-T[i][0]):1};
}
function capital(s){
  var c=s.cash;
  PRODUCTS.forEach(function(p){var it=s.inv[p.id];if(it)c+=it.qty*it.cost;});
  s.transit.forEach(function(o){c+=o.q*o.cost;});
  return c-(s.loan?s.loan.amt:0);
}
function stockTotal(s){var n=0;PRODUCTS.forEach(function(p){var it=s.inv[p.id];if(it)n+=it.qty;});return n;}

function events(s){
  if(Math.random()>0.16)return;
  var un=PRODUCTS.filter(function(p){return unlocked(s,p);});
  var k=Math.floor(Math.random()*12),p=pick(un);
  if(k===0){s.comp[p.id]={m:0.88,d:7};log('Конкурент знизив ціну на «'+p.name+'» на 12%. Ринкова ціна просіла на тиждень.');}
  else if(k===1){s.buzz[p.id]={m:2,d:3};log('Блогер показав «'+p.name+'». Попит удвічі більший на 3 дні.');}
  else if(k===2){
    if(s.transit.length){var o=pick(s.transit);o.eta+=3;log('Посилка з '+o.sup+' застрягла на митниці. Затримка 3 дні.');}
  }
  else if(k===3){var j=(Math.random()<0.5?-1:1)*(0.8+Math.random()*1.2);s.rate=Math.round(clamp(s.rate+j,41,54)*100)/100;log('Курс долара стрибнув до '+s.rate.toFixed(2).replace('.',',')+' грн.');}
  else if(k===4){s.rep=clamp(s.rep-4,0,100);log('Покупець поскаржився на оголошення. Рейтинг продавця впав.');}
  else if(k===5){if(s.rep<60&&s.ban<=0){s.ban=4;log('OLX заблокував акаунт на 4 дні через скарги. Можна подати апеляцію за 500 грн.');}}
  else if(k===7){var rv=pick(s.rivals);rv.pf=clamp(rv.pf-0.08,0.8,1.1);log(rv.name+' запустив акцію. Їхні ціни нижчі за ринок.');}
  else if(k===8){
    if(s.transit.length){s.transit.forEach(function(o){o.eta+=2;});log('Страйк на пошті: усі посилки в дорозі затримуються на 2 дні.');}
  }
  else if(k===9){
    var it9=s.inv[p.id];
    if(it9&&it9.qty>0){
      var n9=Math.min(it9.qty,6),pr9=Math.round(s.price[p.id]*0.9);
      it9.qty-=n9;s.cash+=n9*pr9;s.profit+=n9*(pr9-it9.cost);
      log('Постійний клієнт узяв оптом '+n9+' шт. «'+p.name+'» зі знижкою 10%: +'+fmt(n9*pr9)+' грн.');
    }
  }
  else if(k===10){
    var it10=s.inv[p.id];
    if(it10&&it10.qty>0&&!s.staff.packer){var n10=Math.min(it10.qty,3);it10.qty-=n10;log('Розбилось під час пакування: '+n10+' шт. «'+p.name+'». Пакувальник цього б не допустив.');}
  }
  else if(k===11){s.rep=clamp(s.rep+5,0,100);log('Вдячний покупець залишив гарний відгук про твій магазин. Рейтинг зріс.');}
  else{
    var st=PRODUCTS.filter(function(q){var it=s.inv[q.id];return it&&it.qty>0;});
    if(st.length){var w=pick(st);s.inv[w.id].qty--;log('Шахрай виманив «'+w.name+'» через фальшиву оплату. Втрачено 1 шт.');}
  }
}

function dealTick(s){
  if(s.deal){s.deal.d--;if(s.deal.d<=0){delete s.deal;}}
  if(!s.deal&&Math.random()<0.22){
    var un=PRODUCTS.filter(function(p){return unlocked(s,p);}),p=pick(un);
    s.deal={id:p.id,pct:Math.round(15+Math.random()*20)/100,d:2+Math.floor(Math.random()*2)};
    log('Флеш-розпродаж у Китаї: «'+p.name+'» −'+Math.round(s.deal.pct*100)+'% ще '+s.deal.d+' дн.');
  }
}
function contractsTick(s,r){
  s.contracts=s.contracts.filter(function(c){
    if(s.day>c.due){
      if(c.acc){s.rep=clamp(s.rep-8,0,100);log('Замовлення для «'+c.who+'» прострочено. Рейтинг впав.');if(!r.stop)r.stop='Прострочено замовлення';}
      return false;
    }
    return true;
  });
  if(s.day>=s.nextContract&&s.contracts.length<3){
    var un=PRODUCTS.filter(function(p){return unlocked(s,p);});
    var p=pick(un),L=lvl(s).i;
    var q=Math.max(3,Math.round((8+Math.random()*12)*(1+L*0.5)/(p.ua>1500?3:1)));
    var price=Math.round(mkt(s,p.id)*(0.92+Math.random()*0.16)/5)*5;
    s.cid++;
    s.contracts.push({id:s.cid,pid:p.id,q:q,price:price,due:s.day+8+Math.floor(Math.random()*7),acc:false,who:pick(WHO)});
    s.nextContract=s.day+4+Math.floor(Math.random()*4);
    log('Нове замовлення від «'+s.contracts[s.contracts.length-1].who+'»: '+q+' × '+p.name+'.');
  }
}

function step(s){
  var r={units:0,rev:0,ad:0,ret:0,retCost:0,salary:0,other:0,profit:0,lines:{},stop:''};
  s.day++;s.date=addDays(s.date,1);
  if(s.ban>0){s.ban--;if(s.ban===0)log('Блокування OLX знято.');}
  s.rate=Math.round(clamp(s.rate+(Math.random()-0.5)*0.5+(45.5-s.rate)*0.02,41,54)*100)/100;
  if(!s.vat&&s.date>='2027-07-01'){
    s.vat=true;
    log('Закон про ПДВ набув чинності: посилки до €150 більше не безподаткові. Закупівлі в Китаї дорожчі на 20%.');
    r.stop='Змінилися правила ПДВ';
  }
  PRODUCTS.forEach(function(p){
    s.trend[p.id]=clamp(s.trend[p.id]+(1-s.trend[p.id])*0.1+(Math.random()-0.5)*0.05,0.8,1.25);
    ['comp','buzz'].forEach(function(k){var e=s[k][p.id];if(e){e.d--;if(e.d<=0)delete s[k][p.id];}});
  });
  events(s);
  contractsTick(s,r);
  dealTick(s);
  rivalsTick(s);
  var rest=[];
  s.transit.forEach(function(o){
    if(s.day>=o.eta){
      if(o.lost){
        if(o.ins){var back=o.q*o.cost*0.9;s.cash+=back;log('Посилка з '+o.sup+' загубилась. Страховка повернула '+fmt(back)+' грн.');}
        else log('Посилка з '+o.sup+' ('+o.q+' шт. «'+P(o.id).name+'») пропала. Гроші не повернули.');
        if(!r.stop)r.stop='Посилка пропала';
        return;
      }
      var it=s.inv[o.id]||(s.inv[o.id]={qty:0,cost:0,defect:0});
      var tot=it.qty+o.q;
      it.cost=(it.qty*it.cost+o.q*o.cost)/tot;
      it.defect=(it.qty*it.defect+o.q*o.defect)/tot;
      it.qty=tot;
      log('Приїхало: '+o.q+' шт. «'+P(o.id).name+'» з '+o.sup+'.');
      if(!r.stop)r.stop='Приїхала посилка';
    } else rest.push(o);
  });
  s.transit=rest;
  var tr=traffic(s);
  PRODUCTS.forEach(function(p){
    var it=s.inv[p.id];
    if(!it||it.qty<=0||!s.listed[p.id]||!avail(s,p))return;
    var price=s.price[p.id];
    var n=Math.min(it.qty,poisson(demand(s,p,price,tr)));
    if(n<=0)return;
    var ok=0,ret=0,i;
    for(i=0;i<n;i++){if(Math.random()<it.defect*(hasPerk(s,'p_def')?0.5:1))ret++;else ok++;}
    var rev=ok*price*(1-tr.comm);
    it.qty-=n;
    var RC=s.staff.packer?25:60;
    s.cash+=rev-ret*RC;
    r.profit+=rev-ok*it.cost-ret*(it.cost+RC);
    r.rev+=rev;r.ret+=ret;r.retCost+=ret*RC;r.units+=ok;
    s.sold+=ok;s.returns+=ret;
    s.rep=clamp(s.rep+ok*0.15-ret*(s.staff.packer?0.75:1.5),0,100);
    r.lines[p.id]={n:ok,rev:rev,price:price};
    s.sales[p.id]=(s.sales[p.id]||0)+ok;
    var ps=s.pstat[p.id]||(s.pstat[p.id]={n:0,pr:0});ps.n+=ok;ps.pr+=rev-ok*it.cost-ret*(it.cost+RC);
    if(Math.random()<0.55)addReview(s,p,price,ret);
    if(it.qty<=0&&!r.stop)r.stop='Закінчився товар: '+p.name;
  });
  var ad=Math.min(s.ad,Math.max(0,s.cash));
  s.cash-=ad;r.ad=ad;
  var sal=0;
  Object.keys(STAFF).forEach(function(k){if(s.staff[k]){var pay=STAFF[k].pay;if(s.cash>=pay){s.cash-=pay;sal+=pay;}else{s.staff[k]=0;log(STAFF[k].name+' пішов: нема чим платити зарплату.');}}});
  r.salary=sal;
  if(r.ret>0)s.streak=0;else if(r.units>0)s.streak++;
  var rent=Math.min(WH[s.wh][1],Math.max(0,s.cash));s.cash-=rent;
  var intr=0;
  if(s.loan.amt>0){intr=s.loan.amt*0.005;if(s.cash>=intr)s.cash-=intr;else s.loan.amt+=intr;}
  var dayNet=r.profit-ad-sal-rent-intr,cut=0;
  if(s.investor.on&&dayNet>0){cut=Math.min(dayNet*0.1,Math.max(0,s.cash));s.cash-=cut;s.investor.paid+=cut;}
  r.other=rent+intr+cut;dayNet-=cut;
  if(s.flags.partner){
    if(s.day<=s.flags.partner&&dayNet>0){var pc=Math.min(dayNet*0.15,Math.max(0,s.cash));s.cash-=pc;dayNet-=pc;r.other+=pc;}
    if(s.day>s.flags.partner){delete s.flags.partner;log('Угода з Дмитром завершилась. Він більше не бере частку прибутку.');}
  }
  storyTick(s,r);
  modeTick(s,r);
  s.profit+=dayNet;
  s.hist.push({d:s.day,cap:Math.round(capital(s)),net:Math.round(dayNet)});
  if(s.hist.length>90)s.hist.shift();
  dailyCheck(s,r,dayNet);
  if(r.units>0||r.ret>0)log('Продано '+r.units+' шт., чистий результат дня '+sg(dayNet)+' грн'+(r.ret?', повернень: '+r.ret:'')+'.');
  if(stockTotal(s)===0&&s.transit.length===0&&s.cash<80){s.over=true;}
  return r;
}

function run(n){
  if(S.over||S.end)return;
  var agg={days:0,units:0,rev:0,ad:0,ret:0,retCost:0,salary:0,other:0,profit:0,lines:{},stop:''};
  var sold0=S.sold,i;
  for(i=0;i<n;i++){
    var _rnd=Math.random;
    if(S.mode==='weekly')Math.random=rng32(hashStr(S.seed+':'+(S.day+1)));
    var r;
    try{r=step(S);}finally{Math.random=_rnd;}
    agg.days++;agg.units+=r.units;agg.rev+=r.rev;agg.ad+=r.ad;agg.ret+=r.ret;agg.retCost+=r.retCost;agg.salary+=r.salary;agg.other+=r.other;agg.profit+=r.profit;
    Object.keys(r.lines).forEach(function(id){
      var l=agg.lines[id]||(agg.lines[id]={n:0,rev:0});
      l.n+=r.lines[id].n;l.rev+=r.lines[id].rev;
    });
    if(r.stop){agg.stop=r.stop;break;}
    if(S.over||S.end)break;
    if(S.limit&&S.day>=S.limit)break;
  }
  S.report=agg;
  if(agg.units>0)sfx('sale');
  var a=lvl({sold:sold0,mode:S.mode}).i,b=lvl(S).i;
  if(b>a)levelUp(a,b);
  var opened=[];
  PRODUCTS.forEach(function(p){if(p.unlock>0&&sold0<p.unlock&&S.sold>=p.unlock)opened.push(p.name);});
  SUPPLIERS.forEach(function(x){if(x.unlock>0&&sold0<x.unlock&&S.sold>=x.unlock)opened.push('постачальник '+x.name);});
  Object.keys(UPG).forEach(function(k){var u=UPG[k];if(u.unlock>0&&sold0<u.unlock&&S.sold>=u.unlock)opened.push('розвиток: '+u.name);});
  if(opened.length&&!isFree(S)){log('Відкрито: '+opened.join(', ')+'.');}
  if(S.mode==='free'&&!S.won&&capital(S)>=GOAL){S.won=true;log('Мета досягнута: капітал '+fmt(capital(S))+' грн. Можна грати далі.');toast('Мета досягнута: 1 000 000 грн капіталу');}
  checkAch();
  if(S.over&&!S.boarded){pushBoard();S.boarded=true;}
  if(S.limit&&S.day>=S.limit&&!S.end&&!S.over)finishRun();
  if(typeof srv==='function'&&srv()&&S.day%5===0){fetchMarket();fetchGuild();}
}

function supStep(sup){return sup.moq>=20?10:sup.moq>=10?5:1;}
function setQty(id,q){var sup=SUP(ui.sup);ui.qty[id]=clamp(Math.round(q)||sup.moq,sup.moq,9999);}
function order(id){
  var p=P(id),sup=SUP(ui.sup),q=ui.qty[id]||sup.moq;
  if(!supOK(S,sup)){ui.sup='taobao';toast('Цей постачальник ще закритий');return;}
  if(q<sup.moq){toast('У '+sup.name+' мінімум '+sup.moq+' шт.');return;}
  if(stockTotal(S)+transitQ(S)+q>whCap(S)){toast('Склад заповнений: ліміт '+whCap(S)+' шт. Збільш його в «Розвитку».');return;}
  var unit=unitCost(S,p,sup),total=unit*q;
  if(total>S.cash){toast('Не вистачає '+fmt(total-S.cash)+' грн');return;}
  S.cash-=total;
  var rnd=S.mode==='weekly'?rng32(hashStr(S.seed+':o:'+S.day+':'+id+':'+S.transit.length)):Math.random;
  var eta=S.day+sup.days+Math.floor(rnd()*3);
  S.transit.push({id:id,q:q,cost:unit,defect:sup.defect,sup:sup.name,eta:eta,ins:S.insured,lost:rnd()<LOSS[sup.id]});
  log('Замовлено '+q+' шт. «'+p.name+'» у '+sup.name+' за '+fmt(total)+' грн. Очікуємо на день '+eta+'.');
  toast('Замовлено: '+q+' шт. Приїде '+dShort(addDays(S.date,Math.max(1,eta-S.day))));
  S.ordered=true;sfx('buy');
}
function toggle(id){
  if(!S.listed[id]&&listedCount(S)>=slots(S)){toast('Усі слоти зайняті. Зніми інший товар або прокачай акаунт.');return;}
  S.listed[id]=!S.listed[id];
}
function acceptC(id){S.contracts.forEach(function(c){if(c.id===id&&!c.acc){c.acc=true;log('Прийнято замовлення: '+c.q+' × «'+P(c.pid).name+'» для «'+c.who+'» за '+fmt(c.q*c.price)+' грн. Термін: день '+c.due+'.');}});}
function fulfillC(id){
  for(var i=0;i<S.contracts.length;i++){
    var c=S.contracts[i];if(c.id!==id)continue;
    var it=S.inv[c.pid];
    if(!it||it.qty<c.q){toast('На складі бракує '+(c.q-(it?it.qty:0))+' шт.');return;}
    var tot=c.q*c.price;
    it.qty-=c.q;S.cash+=tot;S.sold+=c.q;S.profit+=tot-c.q*it.cost;S.rep=clamp(S.rep+3,0,100);S.cdone++;
    S.contracts.splice(i,1);
    log('Виконано замовлення для «'+c.who+'»: +'+fmt(tot)+' грн.');toast('Замовлення виконано: +'+fmt(tot)+' грн');
    sfx('ach');checkAch();return;
  }
}
function appeal(){if(S.ban<=0)return;if(S.cash<500){toast('Не вистачає '+fmt(500-S.cash)+' грн');return;}S.cash-=500;S.ban=0;log('Апеляцію до OLX подано (500 грн). Акаунт розблоковано.');}
function staffToggle(k){

}

function makeReport(){
  var s=S,L=[],best=PRODUCTS.filter(function(p){return s.pstat[p.id];}).sort(function(a,b){return s.pstat[b.id].pr-s.pstat[a.id].pr;});

  if(s.day>0)L.push('У середньому за день: '+fmt(s.profit/s.day)+' грн');

function brandBuy(){

function whUp(){

function borrow(n){
  var l=S.loan,lim=creditLimit(S);
  if(l.amt+n>lim){toast('Ліміт кредиту: '+fmt(lim)+' грн');return;}
  S.cash+=n;l.amt+=n;log('Взято кредит '+fmt(n)+' грн під 0,5% на день.');
}
function repay(n){
  var l=S.loan;n=Math.min(n,l.amt,Math.floor(S.cash));
  if(n<=0){toast('Нічого повертати або немає грошей');return;}
  S.cash-=n;l.amt-=n;
  if(l.amt<=0.5){l.amt=0;l.paid=1;log('Кредит повністю погашено.');checkAch();}
  else log('Повернено '+fmt(n)+' грн кредиту.');
}
function invest(){
  if(S.investor.on||capital(S)<20000)return;
  S.investor.on=true;S.cash+=25000;

  log('Нова подія: '+d.title+'. Потрібне твоє рішення на головній.');

function fmtK(v){return Math.abs(v)>=1000?fmt1(v/1000)+' тис.':fmt(v);}
function lineChart(vals,label){
  if(vals.length<2)return '<p class="hint" style="margin:0">Дані з’являться після кількох днів гри.</p>';
  var W=320,H=110,pl=4,pr=4,pt=10,pb=18,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(max===min){max+=1;min-=1;}
  var n=vals.length,pts=vals.map(function(v,i){return [pl+(W-pl-pr)*i/(n-1),pt+(H-pt-pb)*(1-(v-min)/(max-min))];});
  var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('');
  var area=d+'L'+pts[n-1][0].toFixed(1)+' '+(H-pb)+'L'+pts[0][0].toFixed(1)+' '+(H-pb)+'Z',last=pts[n-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'"><line class="cg" x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/><path class="ca" d="'+area+'"/><path class="cl2" d="'+d+'"/><circle class="cd" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5"/><text class="ct" x="'+pl+'" y="'+(H-4)+'">мін '+fmtK(min)+'</text><text class="ct" x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end">макс '+fmtK(max)+'</text></svg>';
}
function barChart(vals,label){
  if(vals.length<2)return '<p class="hint" style="margin:0">Дані з’являться після кількох днів гри.</p>';
  var W=320,H=110,pt=10,pb=18,max=Math.max.apply(null,vals.concat([1])),min=Math.min.apply(null,vals.concat([0])),n=vals.length;
  var bw=(W-8)/n,sc=(H-pt-pb)/(max-min),zero=pt+max*sc;
  var bars=vals.map(function(v,i){var hg=Math.max(Math.abs(v)*sc,0.5),y=v>=0?zero-hg:zero;return '<rect class="'+(v>=0?'bp':'bn2')+'" x="'+(4+i*bw+bw*0.12).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.76).toFixed(1)+'" height="'+hg.toFixed(1)+'" rx="1"/>';}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'"><line class="cg" x1="0" x2="'+W+'" y1="'+zero.toFixed(1)+'" y2="'+zero.toFixed(1)+'"/>'+bars+'<text class="ct" x="4" y="'+(H-4)+'">мін '+fmtK(min)+'</text><text class="ct" x="'+(W-4)+'" y="'+(H-4)+'" text-anchor="end">макс '+fmtK(max)+'</text></svg>';
}

function workBuy(){

  if(S.cash<c){toast('Не вистачає '+fmt(c-S.cash)+' грн');return;}
  S.cash-=c;w.lvl++;log('Майстерня: рівень '+w.lvl+'.');toast('Майстерня: рівень '+w.lvl);sfx('buy');
}
function assemble(to){
  var r=RECIPES.filter(function(x){return x.to===to;})[0],w=S.work;if(!r||!w.lvl)return;
  if(w.day!==S.day){w.day=S.day;w.used=0;}
  var b=S.inv[r.from],cap=5*w.lvl-w.used;
  if(!b||b.qty<1){toast('Немає заготовок');return;}
  var n=Math.min(b.qty,cap);if(n<1){toast('Ліміт збірки на сьогодні вичерпано');return;}
  var labor=n*r.labor;if(labor>S.cash){n=Math.floor(S.cash/r.labor);labor=n*r.labor;}
  if(n<1){toast('Не вистачає грошей на роботу');return;}
  S.cash-=labor;b.qty-=n;w.used+=n;
  var o=S.inv[to]||(S.inv[to]={qty:0,cost:0,defect:0}),tot=o.qty+n,unit=b.cost+r.labor;
  o.cost=(o.qty*o.cost+n*unit)/tot;o.defect=(o.qty*o.defect+n*0.01)/tot;o.qty=tot;
  log('Зібрано '+n+' шт. «'+P(to).name+'», собівартість '+fmt(unit)+' грн.');toast('Зібрано '+n+' шт.');sfx('ach');checkAch();
}

    case 'rebgo':doRebirth();break;
    case 'guide':guideOpen(0);break;
    case 'guidego':if(+v<0){guideDone();mgClose();}else guideOpen(+v);break;
    case 'week':run(7);break;
    case 'ad':S.ad=+v;break;
    case 'sup':ui.sup=v;ui.qty={};break;
    case 'qm':setQty(id,(ui.qty[id]||sup.moq)-supStep(sup));break;
    case 'qp':setQty(id,(ui.qty[id]||sup.moq)+supStep(sup));break;
    case 'qmax':{var pm=P(id),um=unitCost(S,pm,sup),nm=Math.floor(S.cash/um),room=whCap(S)-stockTotal(S)-transitQ(S);nm=Math.min(nm,room);if(nm<sup.moq){toast(room<sup.moq?'На складі немає місця':'Не вистачає грошей на мінімум '+sup.moq+' шт.');}else setQty(id,nm);break;}
    case 'qx':setQty(id,(ui.qty[id]||sup.moq)*2);break;
    case 'order':order(id);break;
    case 'tog':toggle(id);break;
    case 'pm':stepPrice(id,-1);break;
    case 'pp':stepPrice(id,1);break;
    case 'p5m':S.price[id]=Math.max(10,Math.round(S.price[id]*0.95));break;
    case 'p5p':S.price[id]=Math.round(S.price[id]*1.05);break;
    case 'pmk':S.price[id]=mkt(S,id);break;
    case 'up':buyUp(v);break;
    case 'acc':acceptC(+id);break;
    case 'ful':fulfillC(+id);break;
    case 'ins':S.insured=!S.insured;break;
    case 'appeal':appeal();break;
    case 'staff':staffToggle(v);break;
    case 'brand':brandBuy();break;
    case 'whup':whUp();break;
    case 'borrow':borrow(+v);break;
    case 'repay':repay(+v);break;
    case 'invest':invest();break;
    case 'mute':S.mute=!S.mute;break;
    case 'tourOff':S.tourOff=true;break;
    case 'speed':ui.speed=parseInt(v,10)||0;clkAcc=0;break;
    case 'mode':if(S.day>0&&!S.end&&!S.over){ui.modeAsk=v;}else startMode(v);break;
    case 'modeyes':startMode(v);break;
    case 'modeno':ui.modeAsk='';break;
    case 'metabuy':metaBuy(v);break;
    case 'perk':perkChoose(parseInt(v,10));break;
    case 'wsup':workBuy();break;
    case 'asm':assemble(id);break;
    case 'story':storyChoose(parseInt(v,10));break;
    case 'spin':spin();break;
    case 'pack':pack();break;
    case 'haggle':haggle();break;
    case 'dump':dump(id);break;
    case 'rep':ui.rep=makeReport();break;
    case 'repcopy':copyRep();break;
    case 'export':ui.code=makeCode();break;
    case 'copy':copyCode();break;
    case 'import':importCode();break;
    case 'reset':ui.confirm=true;break;
    case 'reset0':ui.confirm=false;break;
    case 'reset2':if(!S.boarded)pushBoard();S=newState();ui.confirm=false;ui.tab='home';ui.qty={};save();pushCloud();break;
  }
  save();render();
}

document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-a]');
  if(!el)return;
  if(el.dataset.a==='slide'){slide(el.dataset.v);return;}
  act(el.dataset.a,el.dataset.v,el.dataset.id);
});
function rr(el){if(document.activeElement===el)render();}
document.addEventListener('change',function(e){
  var el=e.target;
  if(!el||!el.dataset)return;
  if(el.dataset.qty){setQty(el.dataset.qty,parseFloat(el.value));save();rr(el);}
  else if(el.dataset.imp!==undefined){ui.imp=el.value;}
  else if(el.dataset.bn!==undefined){S.brand.name=String(el.value).slice(0,24);save();rr(el);}
  else if(el.dataset.calc){ui.calc[el.dataset.calc]=Math.max(0,parseFloat(el.value)||0);}
  else if(el.dataset.q!==undefined){ui.q=el.value;rr(el);}
  else if(el.dataset.title){S.title[el.dataset.title]=String(el.value||'').slice(0,90);save();rr(el);}
  else if(el.dataset.price){S.price[el.dataset.price]=Math.max(10,Math.round(parseFloat(el.value))||P(el.dataset.price).ua);save();rr(el);}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el&&el.dataset&&el.dataset.calc){
    ui.calc[el.dataset.calc]=Math.max(0,parseFloat(el.value)||0);
    var o=document.getElementById('calc-out');if(o)o.innerHTML=calcOut();
  }
});

var reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
setInterval(function(){
  if(document.hidden||reduced)return;
  var cars=document.querySelectorAll('.car'),i;
  for(i=0;i<cars.length;i++){if(!cars[i].matches(':hover'))slide(cars[i].id.slice(4)+':n');}
},5500);
var tch=null;
document.addEventListener('touchstart',function(e){var c=e.target.closest&&e.target.closest('.car');tch=c?{x:e.touches[0].clientX,id:c.id.slice(4)}:null;},{passive:true});
document.addEventListener('touchend',function(e){if(!tch)return;var dx=e.changedTouches[0].clientX-tch.x;if(Math.abs(dx)>40)slide(tch.id+':'+(dx<0?'n':'p'));tch=null;},{passive:true});
render();
if(window.requestAnimationFrame)setInterval(clkTick,200);
try{
  if(FBOK()&&acActive())acStart();
  try{document.addEventListener('visibilitychange',function(){if(document.hidden)acPush();});}catch(e){}
  if(!PF)setTimeout(FBOK()?function(){authOpen('login');}:profileOpen,300);
  else if(!localStorage.getItem('cargo-guide'))setTimeout(function(){guideOpen(0);},400);
}catch(e){}
initCloud();
})();
</script>

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
